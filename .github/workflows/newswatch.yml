name: News Watch

on:
  schedule:
    - cron: "17 * * * *"   # 毎時17分（UTC）
  workflow_dispatch:        # 手動実行ボタン

permissions:
  contents: write           # newswatch/state.json をコミットするため

concurrency:
  group: newswatch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check sources
        run: python3 newswatch/newswatch.py
        env:
          # ソースごとの Webhook。ソースを足したら、ここにも1行足す
          NEWSWATCH_WEBHOOK_GLOBALLAB: ${{ secrets.NEWSWATCH_WEBHOOK_GLOBALLAB }}
          NEWSWATCH_WEBHOOK_JP_UPDATE: ${{ secrets.NEWSWATCH_WEBHOOK_JP_UPDATE }}
          NEWSWATCH_WEBHOOK_JP_EVENT: ${{ secrets.NEWSWATCH_WEBHOOK_JP_EVENT }}

      - name: Commit state
        run: |
          if [ -n "$(git status --porcelain newswatch/state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add newswatch/state.json
            git commit -m "newswatch: update state"
            git pull --rebase
            git push
          fi
